<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kisékiéplus</title>
<style>
  :root { --bg:#14111f; --card:#211c33; --line:#3a3354; --txt:#f3effc; --mut:#a49cbf; --acc:#ffcc33; --ok:#3ddc97; --ko:#ff5c7a; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--txt); font:16px/1.5 system-ui, sans-serif; display:flex; justify-content:center; }
  main { width:100%; max-width:720px; padding:24px 16px 48px; }
  h1 { font-size:clamp(2rem,8vw,3.2rem); margin:.2em 0 0; letter-spacing:-.03em; }
  h1 span { color:var(--acc); }
  h2 { font-size:1rem; text-transform:uppercase; letter-spacing:.08em; color:var(--mut); margin:28px 0 10px; }
  .sub { color:var(--mut); margin:0 0 8px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
  button { font:inherit; color:inherit; cursor:pointer; border:2px solid var(--line); background:var(--card); border-radius:14px; padding:14px; text-align:left; }
  button:hover { border-color:var(--mut); }
  button:focus-visible, input:focus-visible { outline:3px solid var(--acc); outline-offset:2px; }
  button[aria-pressed="true"] { border-color:var(--acc); background:#2d2640; }
  .mode b { display:block; font-size:1.1rem; }
  .mode small { color:var(--mut); }
  .mode .done { display:block; margin-top:6px; color:var(--ok); font-weight:700; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chips button { padding:8px 14px; border-radius:999px; }
  .go { display:block; width:100%; margin-top:28px; background:var(--acc); color:#14111f; border-color:var(--acc); font-weight:800; font-size:1.2rem; text-align:center; }
  .go:hover { filter:brightness(1.08); border-color:var(--acc); }
  .top { display:flex; justify-content:space-between; color:var(--mut); font-size:.9rem; }
  .q { font-size:clamp(1.4rem,5vw,2rem); font-weight:800; margin:18px 0 6px; }
  .bar { height:10px; background:var(--card); border-radius:99px; overflow:hidden; margin:14px 0; }
  .bar i { display:block; height:100%; background:var(--acc); transition:width .25s linear; }
  form { display:flex; gap:8px; }
  input { flex:1; min-width:0; font:inherit; font-size:1.1rem; padding:14px; border-radius:14px; border:2px solid var(--line); background:var(--card); color:var(--txt); }
  form button { background:var(--acc); color:#14111f; border-color:var(--acc); font-weight:700; }
  .verdict { font-size:1.3rem; font-weight:800; margin:16px 0 4px; }
  .verdict.ok { color:var(--ok); } .verdict.ko { color:var(--ko); }
  ol { list-style:none; padding:0; margin:12px 0; }
  li { display:grid; grid-template-columns:1fr auto; gap:2px 10px; padding:8px 12px; border-radius:10px; background:var(--card); margin-bottom:6px; border:2px solid transparent; }
  li.me { border-color:var(--acc); }
  li .meta { color:var(--mut); font-size:.85rem; text-align:right; }
  li .pts { grid-column:1/-1; height:4px; background:var(--line); border-radius:9px; overflow:hidden; }
  li .pts i { display:block; height:100%; background:var(--ok); }
  .big { font-size:4rem; font-weight:900; color:var(--acc); margin:10px 0; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <!-- MENU -->
  <section id="menu">
    <h1>Kisékié<span>plus</span></h1>
    <p class="sub">Une question, un chrono, une seule réponse. Choisis bien laquelle.</p>
    <h2>Mode</h2>
    <div class="grid" id="modes"></div>
    <h2>Thème</h2>
    <div class="chips" id="themes"></div>
    <button class="go" id="start">Jouer (7 questions)</button>
  </section>

  <!-- JEU -->
  <section id="game" hidden>
    <div class="top"><span id="round"></span><span id="score"></span></div>
    <p class="sub" id="goal"></p>
    <div class="q" id="question"></div>
    <div id="ask">
      <div class="bar"><i id="timer"></i></div>
      <form id="form" autocomplete="off">
        <input id="answer" aria-label="Ta réponse" placeholder="Ta réponse…">
        <button>Valider</button>
      </form>
      <p class="verdict ko" id="wrong" role="alert" hidden></p>
    </div>
    <div id="reveal" hidden>
      <div class="verdict" id="verdict"></div>
      <p class="sub" id="best"></p>
      <ol id="list"></ol>
      <button class="go" id="next">Suivant</button>
    </div>
  </section>

  <!-- FIN -->
  <section id="end" hidden>
    <h1>Partie <span>terminée</span></h1>
    <div class="big" id="final"></div>
    <p class="sub" id="recap"></p>
    <button class="go" id="again">Rejouer</button>
  </section>
</main>

    ["Danemark",2,2000],["Estonie",1,2001],["Lettonie",1,2002],["Turquie",1,2003],["Ukraine",5,2004],["Grèce",2,2005,"grece"],["Finlande",3,2006],["Serbie",1,2007],
    ["Russie",2,2008],["Azerbaïdjan",1,2011,"azerbaidjan"],["Portugal",3,2017]]},

  { theme:"Borat", q:"Cite un film avec Sacha Baron Cohen", y:"année de sortie", a:[
    ["Ali G",6,2002,"ali g indahouse"],["Madagascar",6,2005],["Borat",40,2006],["Ricky Bobby : roi du circuit",1,2006,"ricky bobby","talladega"],["Sweeney Todd",3,2007],
    ["Brüno",8,2009,"bruno"],["Hugo Cabret",2,2011,"hugo"],["The Dictator",14,2012,"dictator","le dictateur"],["Les Misérables",3,2012,"miserables"],["Grimsby",3,2016,"agent trop special"],
    ["Alice de l'autre côté du miroir",1,2016,"alice"],["Borat 2",10,2020,"borat 2","nouvelle mission","subsequent moviefilm"],["Les Sept de Chicago",2,2020,"sept de chicago","chicago 7"]]},
  { theme:"Borat", q:"Cite un personnage joué par Sacha Baron Cohen", y:"première apparition", a:[
    ["Ali G",18,1998],["Borat",45,2000,"borat sagdiyev"],["Brüno",9,2000,"bruno"],["Roi Julian",8,2005,"julian","king julien","roi julien"],["Jean Girard",1,2006],
    ["Adolfo Pirelli",1,2007,"pirelli"],["Inspecteur Gustave",1,2011,"gustave"],["Amiral Général Aladeen",9,2012,"aladeen"],["Thénardier",3,2012,"thenardier"],
    ["Nobby",1,2016,"nobby butcher"],["Erran Morad",1,2018,"morad"],["Eli Cohen",1,2019,"the spy"],["Abbie Hoffman",1,2020,"hoffman"]]},
];

const MODES = [
  { id:"plus",   name:"La plus citée",   goal:"Donne la réponse que le plus de gens citeraient.", pts:(a,q)=>a[1]/max(q,1) },
  { id:"moins",  name:"La moins citée",  goal:"Donne une réponse juste que presque personne ne citerait.", pts:(a,q)=>1-a[1]/max(q,1) },
  { id:"recent", name:"La plus récente", goal:"Donne la réponse la plus récente possible.", pts:(a,q)=>span(a,q) },
  { id:"ancien", name:"La plus ancienne",goal:"Donne la réponse la plus ancienne possible.", pts:(a,q)=>1-span(a,q) },
];
const max = (q,i) => Math.max(...q.a.map(a=>a[i]));
const min = (q,i) => Math.min(...q.a.map(a=>a[i]));
const span = (a,q) => (a[2]-min(q,2)) / ((max(q,2)-min(q,2)) || 1);
const points = (a,q,m) => Math.round(m.pts(a,q)*100);

const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/&/g," et ").replace(/\+/g," plus ").replace(/#/g," sharp ").replace(/[^a-z0-9]+/g," ").trim();
// Réponse reconnue si un alias apparaît comme mot(s) entier(s) ; le plus long alias gagne (« toy story 2 » bat « toy story »).
function match(input, q) {
  const n = " " + norm(input) + " ";
  let best = null, len = 0;
  for (const a of q.a) for (const x of [a[0], ...a.slice(3)]) {
    const k = norm(x);
    if (k && n.includes(" " + k + " ") && k.length > len) { best = a; len = k.length; }
  }
  return best;
}

const $ = id => document.getElementById(id);
const ROUNDS = 7, DAY = new Date().toLocaleDateString("fr-CA"); // AAAA-MM-JJ local
let mode = MODES[1], theme = "Du jour", deck, round, total, timer, left, TIME;
// Mélange déterministe : même date + même mode = mêmes questions pour tout le monde.
function seeded(str) { let h = 1779033703; for (const c of str) h = Math.imul(h ^ c.charCodeAt(0), 3432918353); return () => ((h = Math.imul(h ^ h >>> 15, 2246822507) ^ Math.imul(h ^ h >>> 13, 3266489909)) >>> 0) / 4294967296; }
const store = { get: k => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k,v) => { try { localStorage.setItem(k,v); } catch {} } };

// Menu
for (const m of MODES) {
  const b = document.createElement("button");
  b.className = "mode";
  b.setAttribute("aria-pressed", m === mode);
  b.onclick = () => { mode = m; [...$("modes").children].forEach(c => c.setAttribute("aria-pressed", c === b)); };
  $("modes").append(b);
}
function paintModes() {
  MODES.forEach((m, i) => {
    const done = store.get(`jour-${DAY}-${m.id}`);
    $("modes").children[i].innerHTML = `<b>${m.name}</b><small>${m.goal}</small>` + (done !== null ? `<small class="done">Partie du jour : ${done}/700</small>` : "");
  });
}
paintModes();
for (const t of ["Du jour", "Tous", ...new Set(QUESTIONS.map(q=>q.theme))]) {
  const b = document.createElement("button");
  b.textContent = t; b.setAttribute("aria-pressed", t === theme);
  b.onclick = () => { theme = t; [...$("themes").children].forEach(c => c.setAttribute("aria-pressed", c === b)); };
  $("themes").append(b);
}

function show(id) { for (const s of ["menu","game","end"]) $(s).hidden = s !== id; }

function start() {
  const rnd = theme === "Du jour" ? seeded(DAY + mode.id) : Math.random;
  deck = QUESTIONS.filter(q => theme === "Du jour" || theme === "Tous" || q.theme === theme)
    .map(q => [rnd(), q]).sort((a,b) => a[0] - b[0]).map(x => x[1]).slice(0, ROUNDS);
  TIME = mode.id === "moins" ? 40 : 30;
  round = 0; total = 0; show("game"); ask();
}

function ask() {
  const q = deck[round];
  $("round").textContent = `Manche ${round+1}/${deck.length} · ${q.theme}`;
  $("score").textContent = `${total} pts`;
  $("goal").textContent = mode.goal + (mode.id === "recent" || mode.id === "ancien" ? ` Critère : ${q.y}.` : "");
  $("question").textContent = q.q;
  $("ask").hidden = false; $("reveal").hidden = true;
  $("answer").value = ""; $("wrong").hidden = true;
  left = TIME; tick(); run();
}
function run() {
  $("answer").disabled = false; $("answer").focus();
  timer = setInterval(() => { left -= .25; tick(); if (left <= 0) answer(""); }, 250);
}
function tick() { $("timer").style.width = (left / TIME * 100) + "%"; }

function answer(text) {
  clearInterval(timer); // chrono en pause pendant la vérification
  const q = deck[round], hit = text.trim() && match(text, q);
  if (text.trim() && !hit) {
    $("wrong").textContent = `« ${text.trim()} » : mauvaise réponse, retente !`;
    $("wrong").hidden = false;
    $("answer").value = ""; $("answer").disabled = true;
    return setTimeout(run, 1000); // 1 s pour lire le message, puis le chrono repart
  }
  const p = hit ? points(hit, q, mode) : 0;
  total += p;
  $("score").textContent = `${total} pts`;
  $("verdict").className = "verdict " + (hit ? "ok" : "ko");
  $("verdict").textContent = hit ? `${hit[0]} : +${p} pts` : "Temps écoulé : 0 pt";
  const sorted = [...q.a].sort((x,y) => points(y,q,mode) - points(x,q,mode));
  $("best").textContent = `Meilleure réponse : ${sorted[0][0]}`;
  $("list").innerHTML = sorted.map(a => `<li class="${a===hit?"me":""}"><span>${a[0]}</span><span class="meta">${a[1]} % · ${a[2] < 0 ? -a[2] + " av. J.-C." : a[2]}</span><span class="pts"><i style="width:${points(a,q,mode)}%"></i></span></li>`).join("");
  $("ask").hidden = true; $("reveal").hidden = false;
  $("next").textContent = round + 1 < deck.length ? "Suivant" : "Voir le score";
  $("next").focus();
}

$("start").onclick = start;
$("again").onclick = () => show("menu");
$("form").onsubmit = e => { e.preventDefault(); answer($("answer").value); };
$("next").onclick = () => {
  if (++round < deck.length) return ask();
  $("final").textContent = `${total} pts`;
  $("recap").textContent = `Mode « ${mode.name} » · thème ${theme} · sur ${deck.length * 100} possibles`;
  if (theme === "Du jour") { store.set(`jour-${DAY}-${mode.id}`, total); paintModes(); }
  show("end");
};

for (const q of QUESTIONS) for (const a of q.a) console.assert(match(a[0], q) === a && typeof a[1] === "number" && Number.isInteger(a[2]), q.q, a[0]);
{ const r1 = seeded("x"), r2 = seeded("x"), v = r1(); console.assert(v === r2() && v >= 0 && v < 1); }
console.assert(points(nolan.a.find(a=>a[0]==="Oppenheimer"), nolan, MODES[2]) === 100);
